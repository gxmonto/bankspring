spring.application.name=bank
# Por defecto MySQL local; se puede cambiar con variables de entorno sin tocar el codigo
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bank_management}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1407}
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
# La sesion viaja solo en la cookie JSESSIONID, nunca en la URL
server.servlet.session.tracking-modes=cookie

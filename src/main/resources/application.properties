spring.application.name=bank
# Por defecto MySQL local; se puede cambiar con variables de entorno sin tocar el codigo
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bank_management}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1407}
# El esquema lo crea Flyway (src/main/resources/db/migration); Hibernate solo verifica que coincida
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
# La sesion viaja solo en la cookie JSESSIONID, nunca en la URL
server.servlet.session.tracking-modes=cookie
# Minutos que dura un codigo de retiro sin tarjeta
bank.withdrawal-code.ttl-minutes=30

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Dashboard')}"></head>
<body class="index">
<div class="container-fluid">
    <div class="row flex-nowrap">
        <nav th:replace="~{fragments/layout :: sidebar('dashboard')}"></nav>
        <div class="col p-3">
            <main class="app-main p-4">
                <div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
                    <div>
                        <h1 class="fw-bold mb-0">Welcome, <span id="holder">...</span></h1>
                        <div class="text-body-secondary">Savings account <strong id="account-number">...</strong></div>
                    </div>
                    <div class="d-flex gap-2 mt-2 mt-md-0">
                        <a th:href="@{/transfer}" class="btn btn-primary"><i class="bi bi-arrow-left-right"></i> Transfer</a>
                        <a th:href="@{/withdraw}" class="btn btn-outline-dark"><i class="bi bi-cash-coin"></i> Withdraw</a>
                    </div>
                </div>

                <div class="row g-3 mb-4">
                    <div class="col-md-4">
                        <div class="card stat-card p-3">
                            <div class="text-body-secondary">Available balance</div>
                            <div class="value" id="available">...</div>
                            <div class="small text-body-secondary">What you can transfer or withdraw now</div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card stat-card p-3">
                            <div class="text-body-secondary">Account balance</div>
                            <div class="value" id="balance">...</div>
                            <div class="small text-body-secondary">Money in your account</div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card stat-card p-3">
                            <div class="text-body-secondary">Reserved</div>
                            <div class="value" id="reserved">...</div>
                            <div class="small text-body-secondary">Held by active withdrawal codes</div>
                        </div>
                    </div>
                </div>

                <h2 class="h4">Recent activity</h2>
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead>
                        <tr><th>Date</th><th>Description</th><th class="text-end">Amount</th><th class="text-end">Balance</th></tr>
                        </thead>
                        <tbody id="transactions">
                        <tr><td colspan="4" class="text-body-secondary">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
                <div id="message" class="d-none"></div>
            </main>
        </div>
    </div>
</div>
<script th:replace="~{fragments/layout :: bootstrap}"></script>
<script>
    const INCOMING = ['DEPOSIT', 'TRANSFER_IN'];

    async function load() {
        try {
            const account = await Bank.api('GET', '/api/v1/account');
            document.getElementById('holder').textContent = account.holderName;
            document.getElementById('account-number').textContent = account.accountNumber;
            document.getElementById('available').textContent = Bank.money(account.available);
            document.getElementById('balance').textContent = Bank.money(account.balance);
            document.getElementById('reserved').textContent = Bank.money(account.reserved);

            const transactions = await Bank.api('GET', '/api/v1/account/transactions');
            document.getElementById('transactions').innerHTML = transactions.length === 0
                ? '<tr><td colspan="4" class="text-body-secondary">No activity yet</td></tr>'
                : transactions.map(t => {
                    const incoming = INCOMING.includes(t.type);
                    return '<tr>' +
                        '<td class="text-nowrap">' + Bank.dateTime(t.date) + '</td>' +
                        '<td>' + Bank.escape(t.description) + '</td>' +
                        '<td class="text-end fw-semibold ' + (incoming ? 'amount-in">+' : 'amount-out">-') + Bank.money(t.amount) + '</td>' +
                        '<td class="text-end">' + Bank.money(t.balanceAfter) + '</td>' +
                        '</tr>';
                }).join('');
        } catch (e) {
            Bank.showMessage(document.getElementById('message'), e.message, 'danger');
        }
    }

    load();
</script>
</body>
</html>

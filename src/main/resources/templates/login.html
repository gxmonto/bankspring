<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>Login | e-Bank</title>
</head>
<body class="login">
<section class="mx-3 my-5 d-flex justify-content-center">
    <section class="border border-3 border-primary p-5 bg-secondary-subtle rounded-4" style="max-width: 440px; width: 100%;">
        <div class="text-center">
            <h2 class="fs-2 pb-3 lead">Signing in</h2>
            <img th:src="@{/img/login.png}" alt="" class="img-fluid">
        </div>
        <div class="alert alert-danger mt-3" th:if="${param.error}">Invalid username or password</div>
        <div class="alert alert-success mt-3" th:if="${param.logout}">You have been signed out</div>
        <!-- th:action agrega automaticamente el token CSRF que pide Spring Security -->
        <form class="mt-3" th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" id="username" name="username" placeholder="Enter your username" required autofocus>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="btn btn-dark w-100 text-white fw-bold">Log in</button>
        </form>
        <div class="mt-4 small text-body-secondary">
            <strong>Demo users:</strong> <code>gustavo</code> / <code>demo123</code>,
            <code>maria</code> / <code>demo123</code>, <code>admin</code> / <code>admin123</code><br>
            <a th:href="@{/atm}" target="_blank"><i class="bi bi-pc-display"></i> Open the ATM simulator</a>
        </div>
    </section>
</section>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Transfer')}"></head>
<body class="index">
<div class="container-fluid">
    <div class="row flex-nowrap">
        <nav th:replace="~{fragments/layout :: sidebar('transfer')}"></nav>
        <div class="col p-3">
            <main class="app-main p-4">
                <div class="row justify-content-center">
                    <div class="col-lg-6">
                        <h1 class="fw-bold">Transfer</h1>
                        <p class="text-body-secondary">Send money to another e-Bank account. Available:
                            <strong id="available">...</strong></p>

                        <form id="transfer-form" class="card stat-card p-4">
                            <div class="mb-3">
                                <label for="to" class="form-label">Destination account</label>
                                <input type="text" class="form-control" id="to" placeholder="1000-0002" required>
                                <div class="form-text">Demo: Maria's account is <code>1000-0002</code>, Gustavo's is <code>1000-0001</code></div>
                            </div>
                            <div class="mb-3">
                                <label for="amount" class="form-label">Amount</label>
                                <div class="input-group">
                                    <span class="input-group-text">$</span>
                                    <input type="number" class="form-control" id="amount" min="0.01" step="0.01" required>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="description" class="form-label">Description (optional)</label>
                                <input type="text" class="form-control" id="description" maxlength="100" placeholder="Rent, dinner...">
                            </div>
                            <button type="submit" class="btn btn-primary w-100"><i class="bi bi-send"></i> Send transfer</button>
                            <div id="message" class="d-none"></div>
                        </form>
                    </div>
                </div>
            </main>
        </div>
    </div>
</div>
<script th:replace="~{fragments/layout :: bootstrap}"></script>
<script>
    const message = document.getElementById('message');

    async function loadAvailable() {
        const account = await Bank.api('GET', '/api/v1/account');
        document.getElementById('available').textContent = Bank.money(account.available);
    }

    document.getElementById('transfer-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        const to = document.getElementById('to').value.trim();
        const amount = document.getElementById('amount').value;
        if (!confirm('Send ' + Bank.money(amount) + ' to account ' + to + '?')) {
            return;
        }
        try {
            const transaction = await Bank.api('POST', '/api/v1/account/transfers', {
                toAccountNumber: to,
                amount: amount,
                description: document.getElementById('description').value
            });
            Bank.showMessage(message, 'Transfer sent. New balance: ' + Bank.money(transaction.balanceAfter), 'success');
            event.target.reset();
            loadAvailable();
        } catch (e) {
            Bank.showMessage(message, e.message, 'danger');
        }
    });

    loadAvailable();
</script>
</body>
</html>

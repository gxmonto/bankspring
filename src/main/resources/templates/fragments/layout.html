<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title th:text="${title} + ' | e-Bank'">e-Bank</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/js/app.js}"></script>
</head>
<body>

<!-- Menu lateral. `active` marca la pagina actual -->
<nav th:fragment="sidebar(active)" class="sidebar col-auto col-md-3 col-xl-2 px-sm-2 px-0 bg-dark">
    <div class="d-flex flex-column align-items-center align-items-sm-start px-3 pt-3 text-white min-vh-100">
        <a th:href="@{/index}" class="d-flex align-items-center pb-3 mb-md-0 me-md-auto text-white text-decoration-none">
            <i class="bi bi-bank fs-4 me-2"></i><span class="fs-5 d-none d-sm-inline fw-bold">e-Bank</span>
        </a>
        <ul class="nav nav-pills flex-column mb-sm-auto mb-0 align-items-center align-items-sm-start w-100">
            <th:block sec:authorize="hasRole('CUSTOMER')">
                <li class="nav-item w-100">
                    <a th:href="@{/index}" class="nav-link px-2" th:classappend="${active == 'dashboard'} ? 'active'">
                        <i class="bi bi-speedometer2"></i> <span class="ms-1 d-none d-sm-inline">Dashboard</span></a>
                </li>
                <li class="nav-item w-100">
                    <a th:href="@{/transfer}" class="nav-link px-2" th:classappend="${active == 'transfer'} ? 'active'">
                        <i class="bi bi-arrow-left-right"></i> <span class="ms-1 d-none d-sm-inline">Transfer</span></a>
                </li>
                <li class="nav-item w-100">
                    <a th:href="@{/withdraw}" class="nav-link px-2" th:classappend="${active == 'withdraw'} ? 'active'">
                        <i class="bi bi-cash-coin"></i> <span class="ms-1 d-none d-sm-inline">Cardless withdrawal</span></a>
                </li>
                <li class="nav-item w-100">
                    <a th:href="@{/deposit}" class="nav-link px-2" th:classappend="${active == 'deposit'} ? 'active'">
                        <i class="bi bi-piggy-bank"></i> <span class="ms-1 d-none d-sm-inline">Deposit</span></a>
                </li>
            </th:block>
            <li class="nav-item w-100" sec:authorize="hasRole('ADMIN')">
                <a th:href="@{/admin}" class="nav-link px-2" th:classappend="${active == 'admin'} ? 'active'">
                    <i class="bi bi-shield-lock"></i> <span class="ms-1 d-none d-sm-inline">Admin</span></a>
            </li>
            <li class="nav-item w-100">
                <a th:href="@{/atm}" target="_blank" class="nav-link px-2">
                    <i class="bi bi-pc-display"></i> <span class="ms-1 d-none d-sm-inline">ATM simulator</span></a>
            </li>
        </ul>
        <hr class="w-100">
        <div class="pb-4 w-100">
            <div class="small text-white-50 mb-2 d-none d-sm-block">
                <i class="bi bi-person-circle"></i> <span sec:authentication="name">user</span>
            </div>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="btn btn-outline-light btn-sm w-100">
                    <i class="bi bi-box-arrow-right"></i> <span class="d-none d-sm-inline">Sign out</span>
                </button>
            </form>
        </div>
    </div>
</nav>

<script th:fragment="bootstrap" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
